<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" width="980" height="452"
     font-family="Georgia, 'Times New Roman', serif" role="img"
     aria-label="Architecture of the Jules Verne character-level GRU model">
  <title>Jules Verne RNN — character-level GRU</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6a2f"/>
    </marker>
    <marker id="arwRec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a4552e"/>
    </marker>
  </defs>

  <rect width="980" height="452" fill="#fbf8f2"/>

  <text x="24" y="34" font-size="19" fill="#2f2416" font-weight="bold">
    Jules Verne Bot — the RNN (character-level GRU)
  </text>
  <text x="24" y="55" font-size="13" fill="#6b5a3e">
    4,095,867 parameters · predicts one character at a time · 120-character window
  </text>

  <!-- input characters -->
  <g font-size="13">
    <text x="24" y="104" fill="#6b5a3e">input</text>
    <text x="24" y="122" fill="#2f2416" font-family="'SF Mono', Menlo, monospace">"THE FLY"</text>
  </g>

  <!-- Embedding -->
  <rect x="24" y="146" width="186" height="86" rx="8" fill="#3f5f6b" stroke="#2c454e"/>
  <text x="117" y="174" font-size="14" fill="#f3ece0" text-anchor="middle" font-weight="bold">Embedding</text>
  <text x="117" y="196" font-size="12" fill="#cfe0e4" text-anchor="middle">123 → 256</text>
  <text x="117" y="214" font-size="11" fill="#9fb8bf" text-anchor="middle">one row per character</text>

  <line x1="210" y1="189" x2="252" y2="189" stroke="#8a6a2f" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- GRU cell -->
  <rect x="256" y="96" width="330" height="200" rx="10" fill="#fffdf8" stroke="#c9a227" stroke-width="1.8"/>
  <text x="421" y="122" font-size="15" fill="#2f2416" text-anchor="middle" font-weight="bold">GRU · 1024 units</text>
  <text x="421" y="140" font-size="11" fill="#6b5a3e" text-anchor="middle">reset_after = true</text>

  <!-- gates -->
  <g font-size="12">
    <rect x="276" y="156" width="88" height="30" rx="6" fill="#d9a441" opacity="0.9"/>
    <text x="320" y="176" fill="#2f2416" text-anchor="middle">update z</text>

    <rect x="377" y="156" width="88" height="30" rx="6" fill="#c98a3c" opacity="0.9"/>
    <text x="421" y="176" fill="#2f2416" text-anchor="middle">reset r</text>

    <rect x="478" y="156" width="88" height="30" rx="6" fill="#b06a3b" opacity="0.9"/>
    <text x="522" y="176" fill="#fdf6ea" text-anchor="middle">candidate h̃</text>
  </g>

  <g font-size="10.5" fill="#6b5a3e" font-family="'SF Mono', Menlo, monospace">
    <text x="276" y="206">z = σ(x·Wz + h·Rz + bz)</text>
    <text x="276" y="224">r = σ(x·Wr + h·Rr + br)</text>
    <text x="276" y="242">h̃ = tanh(x·Wh + r·(h·Rh))</text>
    <text x="276" y="266" fill="#a4552e">h′ = z·h + (1 − z)·h̃</text>
  </g>

  <!-- recurrent loop -->
  <path d="M 421 296 L 421 330 L 350 330 L 350 300" fill="none" stroke="#a4552e"
        stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwRec)"/>
  <text x="356" y="346" font-size="11" fill="#a4552e">hidden state h carried forward (this is the memory)</text>

  <!-- Dense -->
  <line x1="586" y1="189" x2="628" y2="189" stroke="#8a6a2f" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="632" y="146" width="150" height="86" rx="8" fill="#5c4a6e" stroke="#453757"/>
  <text x="707" y="174" font-size="14" fill="#f3ece0" text-anchor="middle" font-weight="bold">Dense</text>
  <text x="707" y="196" font-size="12" fill="#ded3e6" text-anchor="middle">1024 → 123</text>
  <text x="707" y="214" font-size="11" fill="#b9aac4" text-anchor="middle">raw scores (logits)</text>

  <!-- sampling -->
  <line x1="782" y1="189" x2="824" y2="189" stroke="#8a6a2f" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="828" y="146" width="128" height="86" rx="8" fill="#2f6b4f" stroke="#22503b"/>
  <text x="892" y="172" font-size="13" fill="#f3ece0" text-anchor="middle" font-weight="bold">Sampling</text>
  <text x="892" y="192" font-size="11" fill="#cfe4d8" text-anchor="middle">÷ temperature</text>
  <text x="892" y="208" font-size="11" fill="#cfe4d8" text-anchor="middle">top-k · softmax</text>
  <text x="892" y="224" font-size="11" fill="#cfe4d8" text-anchor="middle">draw one</text>

  <!-- feedback -->
  <path d="M 892 232 L 892 400 L 117 400 L 117 232" fill="none" stroke="#8a6a2f"
        stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="504" y="380" font-size="11" fill="#6b5a3e" text-anchor="middle">
    the sampled character is appended to the input and the whole cycle repeats
  </text>

  <!-- cost note -->
  <line x1="24" y1="412" x2="956" y2="412" stroke="#ddd2ba"/>
  <text x="24" y="436" font-size="12" fill="#6b5a3e">
    Cost per character is constant: the hidden state summarises everything read so far, so one character costs one GRU step
    (~0.15 ms in NumPy).
  </text>
</svg>
